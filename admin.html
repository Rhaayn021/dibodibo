<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foli – Dashboard Penjualan</title>
<style>
:root{--p:#1B8A55;--pd:#14703F;--pl:#E6F4EC;--bg:#F1F4F8;--c:#fff;--tx:#1f3a2b;--mu:#6b7c72;--bd:#e3e9e5;--hv:#f6f9f7;--bl:#3b82f6;--or:#f59e0b;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;transition:.18s}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
/* Sidebar */
.side{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,#0f5a33,#1B8A55);color:#fff;padding:18px 12px;overflow:auto;z-index:20;transition:transform .2s}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
.logo img{width:46px;height:46px;border-radius:12px;background:#fff;padding:3px}.logo b{font-size:20px;letter-spacing:.5px}.logo small{display:block;font-size:11px;opacity:.8;line-height:1.3}
.grp{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.65;margin:18px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;color:#fff;padding:11px 12px;border-radius:10px;text-align:left;opacity:.9}
.nav:hover{background:rgba(255,255,255,.08)}.nav.on{background:rgba(255,255,255,.15);opacity:1;font-weight:600}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
/* Topbar & main */
.main{margin-left:270px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--c);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 24px}
.top h2{margin:0;font-size:17px}.top small{color:var(--mu)}.sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;color:var(--mu);background:var(--c)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:700}
.burger{display:none;background:none;padding:6px;color:var(--tx)}
.wrap{padding:24px;max-width:1300px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}.head h1{margin:0;font-size:24px}.head p{margin:2px 0 0;color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-weight:600;background:var(--p);color:#fff;text-decoration:none}
.btn:hover{background:var(--pd)}.btn.ol{background:var(--c);color:var(--tx);border:1px solid var(--bd)}.btn.ol:hover{background:var(--hv)}
.btn.rd{background:var(--c);color:var(--rd);border:1px solid var(--rd)}.btn.sm{padding:6px 14px}
/* Banner */
.ban{display:flex;align-items:center;background:var(--pl);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px}
.ban>b{background:var(--p);color:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.mq{flex:1;overflow:hidden;white-space:nowrap;padding:0 12px}.mq span{display:inline-block;padding-left:100%;animation:mq 26s linear infinite;color:var(--tx)}
@keyframes mq{to{transform:translateX(-100%)}}.mq i{color:var(--or);font-style:normal}
.ban a{padding:0 16px;color:var(--p);font-weight:600;cursor:pointer;white-space:nowrap}
/* Cards */
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:10px}
.st{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;padding:20px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#14703F,#1B8A55);box-shadow:0 2px 6px rgba(20,112,63,.25);transition:.18s}
.st:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,112,63,.3)}
.st:after{content:"";position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}
.st .ib{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.st small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;opacity:.9;text-transform:uppercase}.st b{font-size:26px;line-height:1.2}
.note{color:var(--mu);margin:0 0 16px;display:flex;gap:6px;align-items:center}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.09)}
.card h3{margin:0;font-size:15px}.card .sub{color:var(--mu);font-size:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start}.hd a{color:var(--bl);font-size:12px;cursor:pointer}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.bar div{height:8px;background:var(--hv);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:var(--p);border-radius:9px}.bar.b i{background:var(--bl)}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar b{text-align:right}
.dn{display:flex;flex-wrap:wrap;align-items:center;gap:26px;justify-content:center;padding:6px 0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}.ring div{width:104px;height:104px;border-radius:50%;background:var(--c);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mu)}.ring b{font-size:26px;color:var(--tx);display:block}
.lg div{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.lg i{width:9px;height:9px;border-radius:50%}.lg b{margin-left:auto;padding-left:18px}
/* Tabel */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{background:var(--hv);color:var(--mu);font-size:12px;text-align:left;padding:10px;white-space:nowrap}td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}tr:hover td{background:var(--hv)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.s0{background:#fef3c7;color:#92400e}.s1{background:#dbeafe;color:#1e40af}.s2{background:#ede9fe;color:#5b21b6}.s3{background:#d1fae5;color:#065f46}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--c)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.pc{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;transition:.18s}.pc:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.09)}
.pc .e{font-size:38px;background:var(--pl);border-radius:12px;padding:6px;margin-bottom:6px}.pc b{display:block}.pc small{color:var(--mu)}
.q{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.q button{background:var(--pl);color:var(--p);border-radius:8px;padding:4px 12px;font-weight:700}
.row{display:flex;justify-content:space-between;padding:5px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:var(--c);border:1px solid var(--bd);border-radius:99px;padding:6px 14px}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.rep{display:flex;flex-direction:column;gap:6px}.rep .ri{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px}
.rep p{color:var(--mu);margin:0 0 12px;flex:1}.rep .big{font-size:24px;font-weight:700;margin:2px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1B8A55;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.on{opacity:1}
.hide{display:none}
.gb{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}.ck{position:sticky;top:84px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q button{padding:8px 14px}.qi{width:56px;text-align:center;padding:7px 4px;font-weight:700;border-radius:9px}
[style*="width:280px"]{width:100%!important;max-width:320px}
.fab{display:none;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;border-radius:14px;padding:14px;font-weight:700;box-shadow:0 8px 20px rgba(20,112,63,.35)}
@media(max-width:1000px){.gb{grid-template-columns:1fr}.ck{position:static}.fab.on{display:flex}.wrap{padding-bottom:90px}}
@media(max-width:560px){.fg{grid-template-columns:1fr}.head h1{font-size:20px}.pg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.st{padding:16px}.card{padding:16px}.top h2{font-size:15px}}
.rpw{display:flex;align-items:center;gap:6px;width:160px}.rpw span{color:var(--mu);font-weight:600}.rpi{text-align:right;font-weight:600}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}.ov.open{display:block}.main{margin-left:0}.burger{display:block}.top{padding:10px 14px}.wrap{padding:14px}.chip.d{display:none}.uname{display:none}}
@media print{.side,.top,.head .btn,.tabs{display:none}.main{margin:0}}
</style>
</head>

 let a=0;const cg=cnt.map((n,i)=>{const s=a;a+=n/(O.length||1)*100;return SC[i]+" "+s+"% "+a+"%"}).join(",");
 return `<div class="head"><div><h1>Ringkasan Penjualan</h1><p>Ikhtisar pesanan, stok, pelanggan, dan omzet Foli.</p></div><div class="sp"></div><button class="btn ol" data-go="lapor">${ic("file",16)}Laporan</button><button class="btn" data-go="buat">${ic("plus",16)}Buat Pesanan</button></div>
 <div class="ban"><b>${ic("alert",16)}Notifikasi Stok</b><div class="mq"><span>${low.length?low.map(p=>`<i>⚠</i> ${esc(p.n)} tinggal ${p.s} ${p.u}`).join(" &nbsp;·&nbsp; "):"Semua stok aman."}</span></div><a data-go="produk">Kelola Stok →</a></div>
 <div class="g4">${S.map(x=>`<div class="st"><div class="ib">${ic(x[2],24)}</div><div><small>${x[0]}</small><b>${x[1]}</b></div></div>`).join("")}</div>
 <p class="note">${ic("info",15)}Omzet dihitung dari pesanan berstatus Selesai. Gratis ongkir untuk belanja di atas ${rp(GRATIS)}.</p>
 <div class="g3">
  <div class="card"><h3>Status Pesanan</h3><div class="sub">Distribusi status pengantaran</div><div class="dn"><div class="ring" style="background:conic-gradient(${cg})"><div><span><b>${O.length}</b>Total</span></div></div><div class="lg">${ST.map((s,i)=>`<div><i style="background:${SC[i]}"></i>${s}<b>${cnt[i]}</b></div>`).join("")}</div></div></div>
  <div class="card"><div class="hd"><div><h3>Produk Terlaris</h3><div class="sub">Jumlah item terjual</div></div><a data-go="produk">Kelola</a></div>${bars(sorted(top).slice(0,6))}</div>
  <div class="card"><h3>Penjualan per Kategori</h3><div class="sub">Item terjual per kategori</div>${bars(sorted(cat),"b")}</div>
 </div>
 <div class="g2"><div class="card"><h3>Pesanan Terbaru</h3><div class="sub">5 pesanan terakhir</div><div class="tw"><table><tr><th>No</th><th>Pelanggan</th><th>Total</th><th>Status</th></tr>${O.slice(0,5).map(o=>`<tr><td>${o.id}</td><td>${esc(o.nama)}<br><small style="color:var(--mu)">${esc(o.alamat)}</small></td><td>${rp(o.total)}</td><td>${pill(o.st)}</td></tr>`).join("")}</table></div></div>
 <div class="card"><h3>Jadwal Antar</h3><div class="sub">Pesanan per slot waktu</div>${bars(sorted(slot).map(x=>[x[0].replace("Hari ini, ","H: ").replace("Besok, ","B: "),x[1]]),"b")}</div></div>`}

// ===== Halaman: Buat Pesanan =====
const sub=()=>Object.entries(cart).reduce((s,[i,n])=>s+n*pOf(i).p,0);
function buat(){
 return `<div class="head"><div><h1>Buat Pesanan</h1><p>Pilih sayur, isi data pelanggan, lalu kirim ke WhatsApp.</p></div></div>
 <div class="gb"><div style="min-width:0"><input id="sq" placeholder="Cari sayur…" aria-label="Cari sayur"><div class="pg" id="pg"></div></div><div class="card ck" id="ck"></div></div><button class="fab" id="fab"></button>`}
function pgrid(){const q=($("#sq")||{value:""}).value.toLowerCase();
 $("#pg").innerHTML=P.filter(p=>p.n.toLowerCase().includes(q)).map(p=>{const n=cart[p.id]||0;return `<div class="pc"><div class="e">${p.e}</div><b>${p.n}</b><small>${rp(p.p)} / ${p.u}<br>stok ${p.s}</small>${p.s<=0?'<div class="q"><small>Habis</small></div>':`<div class="q"><button data-d="-1" data-i="${p.id}">−</button><input class="qi" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="${n}" data-i="${p.id}" aria-label="Jumlah ${p.n}"><button data-d="1" data-i="${p.id}">+</button></div>`}</div>`}).join("");cform()}
function cform(){const s=sub(),o=s>=GRATIS||!s?0:ONGKIR,keep=["fn","fw","fa","fs","fp","fc"].map(i=>$("#"+i)?$("#"+i).value:"");
 $("#ck").innerHTML=`<h3>Keranjang</h3><div class="sub">${Object.keys(cart).length} jenis sayur</div>${Object.entries(cart).map(([i,n])=>`<div class="row"><span>${pOf(i).e} ${pOf(i).n} ×${n}</span><b>${rp(n*pOf(i).p)}</b></div>`).join("")||'<p class="sub">Keranjang kosong.</p>'}
 <div class="row"><span>Ongkir</span><span>${s?(o?rp(o):"Gratis"):"-"}</span></div><div class="row"><b>Total</b><b style="color:var(--p);font-size:18px">${rp(s+o)}</b></div>
 <div class="fg"><div><label>Nama</label><input id="fn" autocomplete="name"></div><div><label>No. WhatsApp</label><input id="fw" type="tel" inputmode="tel" autocomplete="tel"></div></div><label>Alamat</label><textarea id="fa" rows="2"></textarea>
 <div class="fg"><div><label>Jam antar</label><select id="fs">${SL.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Pembayaran</label><select id="fp">${PAY.map(x=>`<option>${x}</option>`).join("")}</select></div></div><label>Catatan</label><input id="fc">
 <button class="btn" style="width:100%;justify-content:center;margin-top:14px" id="sv">Simpan &amp; kirim WhatsApp</button><div id="wa"></div>`;
 ["fn","fw","fa","fs","fp","fc"].forEach((id,k)=>{if(keep[k])$("#"+id).value=keep[k]});const nk=Object.keys(cart).length,fb=$("#fab");if(fb){fb.classList.toggle("on",!!nk);fb.innerHTML=ic("cart",18)+nk+" jenis · "+rp(s+o)+" — Lihat keranjang"}}
function simpan(){const f=i=>$("#"+i).value.trim();
 if(!sub())return toast("Keranjang masih kosong");if(!f("fn")||!f("fw")||!f("fa"))return toast("Nama, WhatsApp, dan alamat wajib diisi");
 const items=Object.entries(cart).map(([i,n])=>{const p=pOf(i);p.s-=n;return{id:+i,n:p.n,q:n,t:n*p.p}}),s=sub(),o=s>=GRATIS?0:ONGKIR;
 const od={id:"FL"+(1040+O.length),d:Date.now(),nama:f("fn"),wa:f("fw"),alamat:f("fa"),slot:f("fs"),bayar:f("fp"),cat:f("fc"),items,sub:s,ongkir:o,total:s+o,st:0};O.unshift(od);save();cart={};
 const msg=`Halo Foli, pesanan ${od.id}:\n`+items.map(i=>`• ${i.n} ×${i.q} = ${rp(i.t)}`).join("\n")+`\n\nOngkir: ${o?rp(o):"Gratis"}\nTotal: ${rp(od.total)}\nNama: ${od.nama}\nAlamat: ${od.alamat}\nJam antar: ${od.slot}\nBayar: ${od.bayar}`+(od.cat?`\nCatatan: ${od.cat}`:"");
 pgrid();$("#wa").innerHTML=`<p class="sub" style="margin-top:12px">Pesanan ${od.id} tersimpan ✅</p><a class="btn ol" style="width:100%;justify-content:center" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">Buka WhatsApp</a>`}

// ===== Halaman: Pesanan =====
function pesan(){const L=O.map((o,i)=>[o,i]).filter(x=>flt<0||x[0].st===flt);
 return `<div class="head"><div><h1>Pesanan</h1><p>Pantau dan ubah status pengantaran.</p></div></div>
 <div class="tabs">${["Semua",...ST].map((s,i)=>`<button class="${i-1===flt?"on":""}" data-f="${i-1}">${s}</button>`).join("")}</div>
 <div class="card tw"><table><tr><th>No</th><th>Pelanggan</th><th>Pesanan</th><th>Antar</th><th>Total</th><th>Status</th></tr>${L.map(([o,i])=>`<tr><td>${o.id}<br><small style="color:var(--mu)">${new Date(o.d).toLocaleDateString("id-ID")}</small></td><td>${esc(o.nama)}<br><small style="color:var(--mu)">${esc(o.wa)}<br>${esc(o.alamat)}</small></td><td>${o.items.map(x=>esc(x.n)+" ×"+x.q).join(", ")}</td><td>${esc(o.slot)}<br><small style="color:var(--mu)">${esc(o.bayar)}</small></td><td>${rp(o.total)}</td><td>${pill(o.st)}<select data-o="${i}" style="margin-top:6px;width:120px">${ST.map((s,k)=>`<option value="${k}" ${k===o.st?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||'<tr><td colspan="6">Tidak ada pesanan.</td></tr>'}</table></div>`}

// ===== Halaman: Produk =====
function produk(){return `<div class="head"><div><h1>Produk &amp; Stok</h1><p>Ubah harga dan stok. Stok di bawah 6 ditandai.</p></div></div>
 <div class="card tw"><table><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th></tr>${P.map(p=>`<tr><td>${p.e} <b>${p.n}</b><br><small style="color:var(--mu)">per ${p.u}</small></td><td>${p.c}</td><td><div class="rpw"><span>Rp</span><input type="text" inputmode="numeric" class="rpi" maxlength="11" value="${p.p.toLocaleString("id-ID")}" data-k="p" data-i="${p.id}" aria-label="Harga ${p.n} dalam rupiah"></div></td><td><input type="number" min="0" value="${p.s}" data-k="s" data-i="${p.id}" style="width:90px"></td><td><span class="pill ${p.s<=0?"s0":p.s<=5?"s0":"s3"}">${p.s<=0?"Habis":p.s<=5?"Menipis":"Aman"}</span></td></tr>`).join("")}</table></div>`}

// ===== Halaman: Laporan =====
const csv=rows=>rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
const REP={
 jual:()=>csv([["No","Tanggal","Pelanggan","Alamat","Total","Status"],...O.filter(inPer).map(o=>[o.id,new Date(o.d).toLocaleDateString("id-ID"),o.nama,o.alamat,o.total,ST[o.st]])]),
 stok:()=>csv([["Produk","Kategori","Satuan","Harga","Stok"],...P.map(p=>[p.n,p.c,p.u,p.p,p.s])]),
 omzet:()=>csv([["Omzet selesai",O.filter(o=>inPer(o)&&o.st===3).reduce((a,o)=>a+o.total,0)]]),
 ongkir:()=>csv([["No","Ongkir"],...O.filter(inPer).map(o=>[o.id,o.ongkir])])};
function lapor(){const L=O.filter(inPer),om=L.filter(o=>o.st===3).reduce((a,o)=>a+o.total,0),ok=L.reduce((a,o)=>a+o.ongkir,0);
 const card=(k,ico,col,t,d,extra)=>`<div class="card rep"><div class="ri" style="background:${col}22;color:${col}">${ic(ico,26)}</div><h3 style="font-size:18px">${t}</h3><p>${d}</p>${extra||""}<div style="display:flex;gap:8px">${k.includes("x")?`<button class="btn sm" data-x="${k[0]}">Excel</button>`:""}${k.includes("p")?`<button class="btn rd sm" data-pdf>PDF</button>`:""}</div></div>`;
 return `<div class="head"><div><h1>Laporan</h1><p>Unduh rekap penjualan dan stok Foli.</p></div></div>
 <div class="card" style="margin-bottom:16px"><h3>Filter Laporan</h3><div class="sub">Pilih periode sebelum mencetak.</div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:280px"><label style="margin:0 0 4px">Periode</label><select id="pr"><option value="all" ${per==="all"?"selected":""}>Semua Waktu</option><option value="today" ${per==="today"?"selected":""}>Hari Ini</option><option value="week" ${per==="week"?"selected":""}>7 Hari Terakhir</option></select></div><div><small style="color:var(--mu)">Data pesanan sesuai filter</small><br><b style="font-size:16px">${L.length} pesanan</b></div></div></div>
 <div class="g3">${card("jx","list","#1B8A55","Rekap Penjualan","Daftar pesanan, pelanggan, alamat, total, dan status.")}${card("sx","box","#1B8A55","Rekap Stok","Harga dan sisa stok seluruh produk.")}${card("p","file","#ef4444","Laporan Ringkas","Ringkasan penjualan, stok, dan jadwal antar dalam satu halaman cetak.")}
 ${card("oxp","money","#1B8A55","Rekap Omzet","Total omzet dari pesanan yang sudah selesai.",`<small style="color:var(--mu)">Total omzet</small><div class="big">${rp(om)}</div><small style="color:var(--mu)">${L.filter(o=>o.st===3).length} pesanan selesai</small><br>`).replace('data-x="o"','data-x="omzet"').replace(/data-pdf/,"data-pdf")}
 ${card("kxp","truck","#3b82f6","Rekap Ongkir","Total ongkos kirim yang tertagih.",`<small style="color:var(--mu)">Total ongkir</small><div class="big">${rp(ok)}</div><br>`)}</div>`}
const MAPX={j:"jual",s:"stok",omzet:"omzet",k:"ongkir"};

// ===== Router & event =====
const T={dash:["Dashboard",dash],buat:["Buat Pesanan",buat],pesan:["Pesanan",pesan],produk:["Produk & Stok",produk],lapor:["Laporan",lapor]};
function go(p){page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.p===p));$("#tt").textContent=T[p][0];$("#v").innerHTML=T[p][1]();if(p==="buat"){pgrid()}$("#side").classList.remove("open");$("#ov").classList.remove("open");scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest(s);
 if(c("button.nav"))return go(c("button.nav").dataset.p);
 if(c("[data-go]"))return go(c("[data-go]").dataset.go);
 if(c("[data-i][data-d]")){const b=c("[data-d]"),i=b.dataset.i,p=pOf(i),n=Math.max(0,Math.min(p.s,(cart[i]||0)+ +b.dataset.d));n?cart[i]=n:delete cart[i];return pgrid()}
 if(c("[data-f]")){flt=+c("[data-f]").dataset.f;return go("pesan")}
 if(c("#sv"))return simpan();
 if(c("#fab"))return $("#ck").scrollIntoView({behavior:"smooth",block:"start"});
 if(c("[data-x]")){const k=MAPX[c("[data-x]").dataset.x[0]==="o"?"omzet":c("[data-x]").dataset.x[0]]||"omzet";const key=c("[data-x]").dataset.x;const f=REP[MAPX[key]||key];
  try{navigator.clipboard.writeText(f()).then(()=>toast("Data disalin. Tempel di Excel atau Google Sheets"),()=>toast("Gagal menyalin data"))}catch(x){toast("Gagal menyalin data")}return}
 if(c("[data-pdf]")){try{window.print()}catch(x){toast("Gunakan fitur cetak browser")}return}
 if(c("#bg")){$("#side").classList.add("open");$("#ov").classList.add("open")}
 if(c("#ov")){$("#side").classList.remove("open");$("#ov").classList.remove("open")}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="sq")pgrid();if(t.classList.contains("rpi")){const d=t.value.replace(/\D/g,"");t.value=d?Number(d).toLocaleString("id-ID"):""}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.o!=null){O[t.dataset.o].st=+t.value;save();go("pesan")}
 else if(t.dataset.k){pOf(t.dataset.i)[t.dataset.k]=Math.max(0,parseInt(String(t.value).replace(/\D/g,""),10)||0);save();go("produk")}
 else if(t.id==="pr"){per=t.value;go("lapor")}});
// Input jumlah: hanya angka positif (huruf, minus, dan desimal otomatis dihapus)
const isQ=t=>t.classList&&t.classList.contains("qi");
document.addEventListener("input",e=>{if(isQ(e.target))e.target.value=e.target.value.replace(/\D/g,"").slice(0,3)});
document.addEventListener("keydown",e=>{if(isQ(e.target)&&e.key==="Enter")e.target.blur()});
document.addEventListener("change",e=>{const t=e.target;if(!isQ(t))return;const i=t.dataset.i,p=pOf(i);let n=parseInt(t.value,10);if(!n||n<1)n=cart[i]||1;if(n>p.s){n=p.s;toast("Stok "+p.n+" hanya "+p.s)}cart[i]=n;pgrid()});
go("dash");
</script>
</body>
</html>
