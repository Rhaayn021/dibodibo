<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.4.8/sweetalert2.all.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dibo Dibo – Dashboard Penjualan</title>
<style>
:root{--p:#1B8A55;--pd:#14703F;--pl:#E6F4EC;--bg:#F1F4F8;--c:#fff;--tx:#1f3a2b;--mu:#6b7c72;--bd:#e3e9e5;--hv:#f6f9f7;--bl:#3b82f6;--or:#f59e0b;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;transition:.18s}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
/* Sidebar */
.side{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,#0f5a33,#1B8A55);color:#fff;padding:18px 12px;overflow:auto;z-index:20;transition:transform .2s}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
.logo img{width:56px;height:56px;border-radius:14px;background:#fff;padding:2px;object-fit:contain;flex:none}.logo b{font-size:20px;letter-spacing:.5px}.logo small{display:block;font-size:11px;opacity:.8;line-height:1.3}
.grp{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.65;margin:18px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;color:#fff;padding:11px 12px;border-radius:10px;text-align:left;opacity:.9}
.nav:hover{background:rgba(255,255,255,.08)}.nav.on{background:rgba(255,255,255,.15);opacity:1;font-weight:600}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
/* Topbar & main */
.main{margin-left:270px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--c);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 24px}
.top h2{margin:0;font-size:17px}.top small{color:var(--mu)}.sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;color:var(--mu);background:var(--c)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:700}
.burger{display:none;background:none;padding:6px;color:var(--tx)}
.wrap{padding:24px;max-width:1300px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}.head h1{margin:0;font-size:24px}.head p{margin:2px 0 0;color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-weight:600;background:var(--p);color:#fff;text-decoration:none}
.btn:hover{background:var(--pd)}.btn.ol{background:var(--c);color:var(--tx);border:1px solid var(--bd)}.btn.ol:hover{background:var(--hv)}
.btn.rd{background:var(--c);color:var(--rd);border:1px solid var(--rd)}.btn.sm{padding:6px 14px}
/* Banner */
.ban{display:flex;align-items:center;background:var(--pl);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px}
.ban>b{background:var(--p);color:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.mq{flex:1;overflow:hidden;white-space:nowrap;padding:0 12px}.mq span{display:inline-block;padding-left:100%;animation:mq 26s linear infinite;color:var(--tx)}
@keyframes mq{to{transform:translateX(-100%)}}.mq i{color:var(--or);font-style:normal}
.ban a{padding:0 16px;color:var(--p);font-weight:600;cursor:pointer;white-space:nowrap}
/* Cards */
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-bottom:10px}
.st{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;padding:20px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#14703F,#1B8A55);box-shadow:0 2px 6px rgba(20,112,63,.25);transition:.18s}
.st:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,112,63,.3)}
.st:after{content:"";position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}
.st .ib{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.st small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;opacity:.9;text-transform:uppercase}.st b{font-size:26px;line-height:1.2}
.note{color:var(--mu);margin:0 0 16px;display:flex;gap:6px;align-items:center}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.09)}
.card h3{margin:0;font-size:15px}.card .sub{color:var(--mu);font-size:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start}.hd a{color:var(--bl);font-size:12px;cursor:pointer}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin:11px 0;font-size:13px}
.bar div{height:8px;background:var(--hv);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:var(--p);border-radius:9px}.bar.b i{background:var(--bl)}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar b{text-align:right}
.dn{display:flex;flex-wrap:wrap;align-items:center;gap:26px;justify-content:center;padding:6px 0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}.ring div{width:104px;height:104px;border-radius:50%;background:var(--c);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mu)}.ring b{font-size:26px;color:var(--tx);display:block}
.lg div{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.lg i{width:9px;height:9px;border-radius:50%}.lg b{margin-left:auto;padding-left:18px}
/* Tabel */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{background:var(--hv);color:var(--mu);font-size:12px;text-align:left;padding:10px;white-space:nowrap}td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}tr:hover td{background:var(--hv)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.s0{background:#fef3c7;color:#92400e}.s1{background:#dbeafe;color:#1e40af}.s2{background:#ede9fe;color:#5b21b6}.s3{background:#d1fae5;color:#065f46}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--c)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.pc{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;transition:.18s}.pc:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.09)}
.pc .e{font-size:38px;background:var(--pl);border-radius:12px;padding:6px;margin-bottom:6px}.pc b{display:block}.pc small{color:var(--mu)}
.q{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.q button{background:var(--pl);color:var(--p);border-radius:8px;padding:4px 12px;font-weight:700}
.row{display:flex;justify-content:space-between;padding:5px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:var(--c);border:1px solid var(--bd);border-radius:99px;padding:6px 14px}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.rep{display:flex;flex-direction:column;gap:6px}.rep .ri{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px}
.rep p{color:var(--mu);margin:0 0 12px;flex:1}.rep .big{font-size:24px;font-weight:700;margin:2px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1B8A55;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.on{opacity:1}
.hide{display:none}
.s4{background:#fee2e2;color:#991b1b}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}.mdl.on{display:flex}.mbox{background:#fff;border-radius:16px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}.swal2-container{z-index:2000!important}.pill.s1,.pill.s2{white-space:nowrap}
.gb{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}.ck{position:sticky;top:84px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q button{padding:8px 14px}.qi{width:56px;text-align:center;padding:7px 4px;font-weight:700;border-radius:9px}
[style*="width:280px"]{width:100%!important;max-width:320px}
.fab{display:none;position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;border-radius:14px;padding:14px;font-weight:700;box-shadow:0 8px 20px rgba(20,112,63,.35)}
@media(max-width:1000px){.gb{grid-template-columns:1fr}.ck{position:static}.fab.on{display:flex}.wrap{padding-bottom:90px}}
@media(max-width:560px){.fg{grid-template-columns:1fr}.head h1{font-size:20px}.pg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.st{padding:16px}.card{padding:16px}.top h2{font-size:15px}}
.rpw{display:flex;align-items:center;gap:6px;width:160px}.rpw span{color:var(--mu);font-weight:600}.rpi{text-align:right;font-weight:600}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}.ov.open{display:block}.main{margin-left:0}.burger{display:block}.top{padding:10px 14px}.wrap{padding:14px}.chip.d{display:none}.uname{display:none}}
@media print{.side,.top,.head .btn,.tabs{display:none}.main{margin:0}}
.bi{vertical-align:-.125em;flex:none}.btn.ib{padding:5px 10px;font-size:12px;font-weight:500;gap:5px;line-height:1.3}.btn.ib .bi{display:block}
</style>
</head>

 ["fn","fw","fa","fs","fp","fc"].forEach((id,k)=>{if(keep[k])$("#"+id).value=keep[k]});const nk=Object.keys(cart).length,fb=$("#fab");if(fb){fb.classList.toggle("on",!!nk);fb.innerHTML=ic("cart",18)+nk+" jenis · "+rp(s+o)+" — Lihat keranjang"}}

function riwayat(){const L=ljs("foli_log",[]).filter(x=>lf==="all"||x.a===lf);
 return `<div class="head"><div><h1>Riwayat Aktivitas</h1><p>Jejak aktivitas pengguna dan admin, terbaru di atas.</p></div><div class="sp"></div><button class="btn ol" data-lr>Muat Ulang</button><button class="btn" data-lc>Salin CSV</button></div>
 <div class="tabs">${[["all","Semua"],["user","Pengguna"],["admin","Admin"]].map(x=>`<button class="${lf===x[0]?"on":""}" data-lf="${x[0]}">${x[1]}</button>`).join("")}</div>
 <div class="card tw"><table><tr><th>Waktu</th><th>Pelaku</th><th>Peran</th><th>Aktivitas</th><th>Detail</th></tr>${L.slice(0,200).map(x=>`<tr><td style="white-space:nowrap">${tm(x.t)}</td><td>${esc(x.who)}</td><td><span class="pill ${x.a==="admin"?"s2":"s1"}">${x.a==="admin"?"Admin":"Pengguna"}</span></td><td><b>${esc(x.act)}</b></td><td>${esc(x.det||"-")}</td></tr>`).join("")||'<tr><td colspan="5" style="color:var(--mu)">Belum ada aktivitas tercatat.</td></tr>'}</table></div>`}
document.addEventListener("click",e=>{const c=s=>e.target.closest(s);let b;
 if(c("button.nav")){pinMsg=null;udel=null}
 if(b=c("[data-lf]")){lf=b.dataset.lf;return go("log")}
 if(c("[data-lr]"))return go("log");
 if(c("[data-lc]")){const L=ljs("foli_log",[]).filter(x=>lf==="all"||x.a===lf);try{navigator.clipboard.writeText(csv([["Waktu","Pelaku","Peran","Aktivitas","Detail"],...L.map(x=>[new Date(x.t).toLocaleString("id-ID"),x.who,x.a,x.act,x.det])])).then(()=>toast("CSV disalin. Tempel di Excel atau Google Sheets"),()=>toast("Gagal menyalin data"))}catch(x){toast("Gagal menyalin data")}}});

// ===== Modal, SweetAlert & CRUD pengguna/produk =====
const MD=document.createElement("div");MD.className="mdl";document.body.appendChild(MD);
function mopen(title,body,ok,fn){MD.innerHTML=`<div class="mbox"><h3 style="margin:0 0 4px;font-size:18px">${title}</h3>${body}<p id="mer" style="color:var(--rd);min-height:18px;margin:8px 0"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ol" data-mx>Batal</button><button class="btn" data-mok>${ok}</button></div></div>`;MD._f=fn;MD.classList.add("on");const f=MD.querySelector("input");if(f)f.focus()}
const mclose=()=>MD.classList.remove("on"),mv=id=>((MD.querySelector("#"+id)||{}).value||"").trim(),merr=m=>{MD.querySelector("#mer").textContent=m};
async function cf(title,text,btn,danger){if(!await cf1(title,text,btn,danger))return false;if(!window.Swal)return true;const r=await Swal.fire({title:"Yakin?",text:title,icon:"warning",showCancelButton:true,confirmButtonText:btn,cancelButtonText:"Batal",confirmButtonColor:danger?"#ef4444":"#1B8A55",reverseButtons:true,focusCancel:true});return r.isConfirmed}
async function cf1(title,text,btn,danger){if(!window.Swal)return danger?confirm(title+"\n"+text):true;
 const r=await Swal.fire({title,text,icon:danger?"warning":"question",showCancelButton:true,confirmButtonText:btn,cancelButtonText:"Batal",confirmButtonColor:danger?"#ef4444":"#1B8A55",reverseButtons:true,focusCancel:true});return r.isConfirmed}
async function cf2(title,text){if(!await cf1(title,text,"Ya, lanjut",1))return false;if(!window.Swal)return true;
 const r=await Swal.fire({title:"Konfirmasi terakhir",html:"Ketik <b>HAPUS</b> untuk menghapus permanen.",icon:"error",input:"text",inputPlaceholder:"HAPUS",showCancelButton:true,confirmButtonText:"Hapus permanen",cancelButtonText:"Batal",confirmButtonColor:"#ef4444",reverseButtons:true,preConfirm:v=>{if((v||"").trim().toUpperCase()!=="HAPUS"){Swal.showValidationMessage("Ketik HAPUS dengan benar");return false}return true}});return r.isConfirmed}
function uform(w){const u=w?allUsers().find(x=>x.wa===w):null;
 mopen(u?"Edit Pengguna":"Tambah Pengguna",`<label>Nama</label><input id="m_n" value="${esc(u?u.nama:"")}"><label>No. WhatsApp</label><input id="m_w" type="tel" inputmode="tel" value="${esc(u?u.wa:"")}"><label>PIN ${u?"baru (kosongkan jika tidak diubah)":"(4–6 angka)"}</label><input id="m_p" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">`,"Simpan",async()=>{
  const nm=mv("m_n"),w2=nwa(mv("m_w")),pin=mv("m_p"),reg=ljs("foli_users",{}),bl=ljs("foli_block",{});
  if(!nm)return merr("Nama wajib diisi.");if(w2.length<9)return merr("Nomor WhatsApp tidak valid.");if(pin&&!/^\d{4,6}$/.test(pin))return merr("PIN harus 4–6 angka.");
  if(w2!==w&&allUsers().some(x=>x.wa===w2))return merr("Nomor sudah dipakai pengguna lain.");
  if(!u&&!pin)return merr("PIN wajib diisi untuk membuat akun.");
  if(!await cf(u?"Simpan perubahan?":"Tambah pengguna?",nm+" ("+w2+")","Ya, simpan"))return;
  if(!u||u.reg||pin){const rec=(w&&reg[w])||{};if(w)delete reg[w];rec.nama=nm;if(pin)rec.pin=pin;reg[w2]=rec;sjs("foli_users",reg)}
  if(w&&w!==w2&&bl[w]){bl[w2]=1;delete bl[w];sjs("foli_block",bl)}
  if(w){O.forEach(o=>{if(nwa(o.wa)===w){o.nama=nm;o.wa=w2}});save()}
  alog(u?"Edit pengguna":"Tambah pengguna",nm+" ("+w2+")");mclose();toast("Pengguna disimpan");go("user")})}
function pform(id){const p=id?pOf(id):null,cs=["Daun","Umbi","Buah","Bumbu","Paket","Lainnya"];
 mopen(p?"Edit Produk":"Tambah Produk",`<div class="fg"><div><label>Nama produk</label><input id="m_n" value="${esc(p?p.n:"")}"></div><div><label>Emoji</label><input id="m_e" maxlength="4" value="${esc(p?p.e:"🥬")}"></div></div><div class="fg"><div><label>Kategori</label><select id="m_c">${cs.map(c=>`<option ${p&&p.c===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>Satuan</label><input id="m_u" placeholder="ikat, 500 g…" value="${esc(p?p.u:"")}"></div></div><div class="fg"><div><label>Harga (Rp)</label><input id="m_h" inputmode="numeric" value="${p?p.p:""}"></div><div><label>Stok</label><input id="m_s" inputmode="numeric" value="${p?p.s:""}"></div></div>`,"Simpan",async()=>{
  const n=mv("m_n"),e=mv("m_e")||"🥬",c=mv("m_c"),sat=mv("m_u"),h=parseInt(mv("m_h").replace(/\D/g,""),10),s=parseInt(mv("m_s").replace(/\D/g,""),10);
  if(!n||!sat)return merr("Nama dan satuan wajib diisi.");if(!(h>0))return merr("Harga harus lebih dari 0.");if(isNaN(s))return merr("Stok wajib diisi.");
  if(P.some(x=>x.n.toLowerCase()===n.toLowerCase()&&x.id!=id))return merr("Nama produk sudah ada.");
  if(!await cf(p?"Simpan perubahan?":"Tambah produk?",n+" · "+rp(h)+" · stok "+s,"Ya, simpan"))return;
  if(p)Object.assign(p,{n,e,c,u:sat,p:h,s});else P.push({id:Math.max(0,...P.map(x=>x.id))+1,n,e,c,u:sat,p:h,s});
  save();alog(p?"Edit produk":"Tambah produk",n+" · "+rp(h)+" · stok "+s);mclose();toast("Produk disimpan");go("produk")})}
document.addEventListener("click",async e=>{const c=s=>e.target.closest(s);let b;
 if(e.target===MD||c("[data-mx]"))return mclose();
 if(c("[data-mok]")&&MD._f)return MD._f();
 if(c("[data-swa]")){const n=waNorm(($("#s_wa")||{}).value);if(!n)return($("#s_er").textContent="Nomor tidak valid. Contoh: 0812-3456-7890 atau 6281234567890.");if(!await cf("Simpan nomor WhatsApp?",waFmt(n),"Ya, simpan"))return;sjs("foli_wa",n);WA=n;alog("Ubah nomor WhatsApp toko",n);toast("Nomor WhatsApp disimpan");return go("set")}
 if(c("[data-swt]")){const n=waNorm(($("#s_wa")||{}).value);if(!n)return($("#s_er").textContent="Nomor tidak valid. Contoh: 0812-3456-7890 atau 6281234567890.");$("#s_er").textContent="";window.open("https://wa.me/"+n,"_blank","noopener");return}
 if(c("[data-fa]"))return faqForm();
 if(b=c("[data-fe]"))return faqForm(+b.dataset.fe);
 if(b=c("[data-fd]")){const i=+b.dataset.fd,L=faqGet();if(!L[i])return;const q=L[i].q;if(!await cf("Hapus FAQ ini?",q,"Ya, hapus",1))return;L.splice(i,1);sjs("foli_faq",L);alog("Hapus FAQ",q);toast("FAQ dihapus");return go("faq")}
 if(b=c("[data-fm]")){const [i,d]=b.dataset.fm.split(":").map(Number),L=faqGet(),j=i+d;if(!L[i]||!L[j])return;[L[i],L[j]]=[L[j],L[i]];sjs("foli_faq",L);return go("faq")}
 if(c("[data-fr]")){if(!await cf("Pulihkan FAQ bawaan?","Semua perubahan FAQ akan diganti dengan 5 FAQ bawaan.","Ya, pulihkan",1))return;try{localStorage.removeItem("foli_faq")}catch(x){}alog("Pulihkan FAQ bawaan");toast("FAQ dipulihkan");return go("faq")}
 if(c("[data-ua]"))return uform();
 if(b=c("[data-ue]"))return uform(b.dataset.ue);
 if(c("[data-pa]"))return pform();
 if(b=c("[data-nx]")){const o=O[b.dataset.nx],n=o.st+1;if(n>3)return;
  if(!await cf("Pindah proses?","Pesanan "+o.id+" ("+o.nama+") akan dipindah dari "+ST[o.st]+" ke "+ST[n]+". Lanjutkan?","Ya"))return;
  o.st=n;alog("Ubah status pesanan",o.id+" → "+ST[n]);save();toast("Pesanan "+o.id+" menjadi "+ST[n]);return go("pesan")}
 if(b=c("[data-pe]"))return pform(b.dataset.pe);
 if(b=c("[data-ub]")){const w=b.dataset.ub,bl=ljs("foli_block",{}),nm=(allUsers().find(u=>u.wa===w)||{}).nama||w,on=!bl[w];
  if(!await cf(on?"Blokir pengguna?":"Aktifkan pengguna?",nm+" ("+w+")",on?"Ya, blokir":"Ya, aktifkan",on))return;
  if(on){bl[w]=1;alog("Blokir pengguna",nm+" ("+w+")")}else{delete bl[w];alog("Aktifkan pengguna",nm+" ("+w+")")}sjs("foli_block",bl);toast(on?"Pengguna diblokir":"Pengguna diaktifkan");return go("user")}
 if(b=c("[data-upr]")){const w=b.dataset.upr,r=ljs("foli_users",{});if(!r[w])return;
  if(!await cf("Reset PIN?","PIN baru acak dibuat untuk "+r[w].nama+".","Ya, reset"))return;
  const p=String(1000+Math.floor(Math.random()*9000));r[w].pin=p;sjs("foli_users",r);pinMsg={w,n:r[w].nama,p};alog("Reset PIN pengguna",r[w].nama+" ("+w+")");return go("user")}
 if(b=c("[data-udl]")){const w=b.dataset.udl,r=ljs("foli_users",{}),nm=(allUsers().find(u=>u.wa===w)||{}).nama||w,acc=!!r[w];
  if(!await cf2("Hapus pengguna "+nm+"?",acc?"Akun dihapus permanen. Riwayat pesanan tetap tersimpan.":"Pengguna tamu dihapus dari daftar. Riwayat pesanan tetap tersimpan."))return;
  if(acc){delete r[w];sjs("foli_users",r)}else{const hd=ljs("foli_hidden",{});hd[w]=1;sjs("foli_hidden",hd)}alog("Hapus pengguna",nm+" ("+w+")");toast("Pengguna dihapus");return go("user")}
 if(b=c("[data-pd]")){const p=pOf(b.dataset.pd);
  if(!await cf2("Hapus produk "+p.n+"?","Produk dihapus permanen dari katalog. Riwayat pesanan tetap tersimpan."))return;
  P=P.filter(x=>x.id!=p.id);delete cart[p.id];save();alog("Hapus produk",p.n);toast("Produk dihapus");return go("produk")}});

// ===== FAQ toko (dibaca oleh halaman toko lewat kunci foli_faq) =====
const FD=[["Area antar Dibo Dibo sampai mana?","Saat ini melayani Kota Ternate dan sekitarnya. Hubungi kami lewat WhatsApp untuk memastikan alamatmu terjangkau."],["Berapa ongkos kirimnya?","Ongkir Rp5.000 per pesanan, dan gratis untuk belanja di atas Rp50.000."],["Metode pembayaran apa saja?","Bayar di tempat (COD), transfer bank, dan QRIS."],["Bagaimana kalau sayur yang datang kurang segar?","Kabari kami lewat WhatsApp pada hari yang sama, kami ganti atau kembalikan dananya."],["Jam pemesanan dan pengantaran?","Pesan setiap hari. Pilih slot antar: pagi 07.00–09.00, siang 10.00–12.00, atau sore 15.00–17.00."]];
const faqGet=()=>{const f=ljs("foli_faq",null);return Array.isArray(f)?f:FD.map(([q,a])=>({q,a}))};
function faqPg(){const L=faqGet();return `<div class="head"><div><h1>FAQ Toko</h1><p>Tambah, ubah, urutkan, atau hapus pertanyaan dan jawaban yang tampil di bagian FAQ toko online.</p></div><div class="sp"></div><button class="btn ol" data-fr>Pulihkan bawaan</button> <button class="btn" data-fa>${ic("plus",16)}Tambah FAQ</button></div>
 <div class="card tw">${L.length?`<table><tr><th>#</th><th>Pertanyaan</th><th>Jawaban</th><th>Aksi</th></tr>${L.map((f,i)=>`<tr><td>${i+1}</td><td><b>${esc(f.q)}</b></td><td style="min-width:240px;max-width:420px;white-space:pre-line">${esc(f.a)}</td><td style="white-space:nowrap"><button class="btn ol sm" data-fm="${i}:-1" ${i?"":"disabled"} aria-label="Naikkan">↑</button> <button class="btn ol sm" data-fm="${i}:1" ${i<L.length-1?"":"disabled"} aria-label="Turunkan">↓</button> <button class="btn ol sm" data-fe="${i}">Edit</button> <button class="btn rd sm" data-fd="${i}">Hapus</button></td></tr>`).join("")}</table>`:'<p style="padding:18px;color:var(--mu)">Belum ada FAQ. Klik "Tambah FAQ" untuk membuat yang pertama.</p>'}</div>`}
function faqForm(i){const L=faqGet(),f=i==null?null:L[i];
 mopen(f?"Edit FAQ":"Tambah FAQ",`<label>Pertanyaan</label><input id="m_q" maxlength="150" value="${esc(f?f.q:"")}"><label>Jawaban</label><textarea id="m_a" rows="5" maxlength="600" style="resize:vertical">${esc(f?f.a:"")}</textarea>`,"Simpan",async()=>{
  const q=mv("m_q"),a=mv("m_a");
  if(!q||!a)return merr("Pertanyaan dan jawaban wajib diisi.");
  if(L.some((x,k)=>k!==i&&x.q.toLowerCase()===q.toLowerCase()))return merr("Pertanyaan ini sudah ada.");
  if(!await cf(f?"Simpan perubahan FAQ?":"Tambah FAQ?",q,"Ya, simpan"))return;if(f)L[i]={q,a};else L.push({q,a});
  sjs("foli_faq",L);alog(f?"Edit FAQ":"Tambah FAQ",q);mclose();toast("FAQ disimpan");go("faq")})}
// ===== Pengaturan toko: nomor WhatsApp (dibaca toko lewat kunci foli_wa) =====
const waNorm=v=>{let d=String(v||"").replace(/\D/g,"");if(d.startsWith("0"))d="62"+d.slice(1);else if(d.startsWith("8"))d="62"+d;return /^62\d{8,13}$/.test(d)?d:""};
const waFmt=n=>("0"+String(n).slice(2)).replace(/^(\d{4})(\d{4})(\d+)$/,"$1-$2-$3");
function setPg(){return `<div class="head"><div><h1>Pengaturan Toko</h1><p>Nomor WhatsApp yang dipakai tombol chat melayang, pesanan, dan kontak di toko online.</p></div></div>
 <div class="card" style="max-width:520px;padding:20px"><label>Nomor WhatsApp toko</label><input id="s_wa" type="tel" inputmode="tel" value="${esc(waFmt(WA))}" placeholder="0812-3456-7890"><p style="color:var(--mu);font-size:12.5px;margin:6px 0 14px">Boleh diawali 0 atau 62. Disimpan dalam format 62xxxxxxxxxxx. Saat ini aktif: <b>${esc(waFmt(WA))}</b></p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-swa>Simpan</button><button class="btn ol" data-swt>Tes buka WhatsApp</button></div><p id="s_er" style="color:var(--rd);min-height:18px;margin:10px 0 0;font-size:13px"></p></div>`}
const T={dash:["Dashboard",dash],buat:["Buat Pesanan",buat],pesan:["Pesanan",pesan],produk:["Produk & Stok",produk],lapor:["Laporan",lapor],user:["Kontrol Pengguna",pengguna],log:["Riwayat Aktivitas",riwayat],faq:["FAQ Toko",faqPg],set:["Pengaturan Toko",setPg]};
function go(p){page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.p===p));$("#tt").textContent=T[p][0];$("#v").innerHTML=T[p][1]();if(p==="buat"){pgrid()}$("#side").classList.remove("open");$("#ov").classList.remove("open");scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target,c=s=>t.closest(s);
 if(c("button.nav"))return go(c("button.nav").dataset.p);
 if(c("[data-go]"))return go(c("[data-go]").dataset.go);
 if(c("[data-i][data-d]")){const b=c("[data-d]"),i=b.dataset.i,p=pOf(i),n=Math.max(0,Math.min(p.s,(cart[i]||0)+ +b.dataset.d));n?cart[i]=n:delete cart[i];return pgrid()}
 if(c("[data-f]")){flt=+c("[data-f]").dataset.f;return go("pesan")}
 if(c("#sv"))return simpan();
 if(c("#fab"))return $("#ck").scrollIntoView({behavior:"smooth",block:"start"});
 if(c("[data-x]")){const k=MAPX[c("[data-x]").dataset.x[0]==="o"?"omzet":c("[data-x]").dataset.x[0]]||"omzet";const key=c("[data-x]").dataset.x;const f=REP[MAPX[key]||key];alog("Salin rekap laporan",MAPX[key]||key);
  try{navigator.clipboard.writeText(f()).then(()=>toast("Data disalin. Tempel di Excel atau Google Sheets"),()=>toast("Gagal menyalin data"))}catch(x){toast("Gagal menyalin data")}return}
 if(c("[data-pdf]")){try{window.print()}catch(x){toast("Gunakan fitur cetak browser")}return}
 if(c("#bg")){$("#side").classList.add("open");$("#ov").classList.add("open")}
 if(c("#ov")){$("#side").classList.remove("open");$("#ov").classList.remove("open")}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="sq")pgrid();if(t.classList.contains("rpi")){const d=t.value.replace(/\D/g,"");t.value=d?Number(d).toLocaleString("id-ID"):""}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.o!=null){O[t.dataset.o].st=+t.value;alog("Ubah status pesanan",O[t.dataset.o].id+" → "+ST[+t.value]);save();go("pesan")}
 else if(t.dataset.k){const pp=pOf(t.dataset.i),v=Math.max(0,parseInt(String(t.value).replace(/\D/g,""),10)||0);pp[t.dataset.k]=v;alog("Ubah "+(t.dataset.k==="p"?"harga":"stok"),pp.n+" → "+(t.dataset.k==="p"?rp(v):v));save();go("produk")}
 else if(t.id==="pr"){per=t.value;go("lapor")}});
// Input jumlah: hanya angka positif (huruf, minus, dan desimal otomatis dihapus)
const isQ=t=>t.classList&&t.classList.contains("qi");
document.addEventListener("input",e=>{if(isQ(e.target))e.target.value=e.target.value.replace(/\D/g,"").slice(0,3)});
document.addEventListener("keydown",e=>{if(isQ(e.target)&&e.key==="Enter")e.target.blur()});
document.addEventListener("change",e=>{const t=e.target;if(!isQ(t))return;const i=t.dataset.i,p=pOf(i);let n=parseInt(t.value,10);if(!n||n<1)n=cart[i]||1;if(n>p.s){n=p.s;toast("Stok "+p.n+" hanya "+p.s)}cart[i]=n;pgrid()});
go("dash");
</script>
