<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dibo Dibo – Portal Driver</title>
<style>
:root{--p:#1B8A55;--pd:#14703F;--pl:#E6F4EC;--bg:#ffffff;--c:#ffffff;--tx:#1f3a2b;--mu:#6b7c72;--bd:#dfe7e2;--ac:#1B8A55;--rd:#ef4444;--or:#f59e0b;--vi:#8b5cf6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pl:#E6F4EC;--bg:#ffffff;--c:#ffffff;--tx:#1f3a2b;--mu:#6b7c72;--bd:#dfe7e2;color-scheme:light}}
:root[data-theme="dark"]{--pl:#E6F4EC;--bg:#ffffff;--c:#ffffff;--tx:#1f3a2b;--mu:#6b7c72;--bd:#dfe7e2;color-scheme:light}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input{font:inherit}
.hide{display:none!important}
/* login */
.lg{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;background:linear-gradient(160deg,var(--pd),var(--p) 60%,#3aa873)}
.lc{max-width:380px;width:100%;margin:0 auto;background:var(--c);border-radius:20px;padding:26px 22px;box-shadow:0 20px 50px #0004}
.hero{text-align:center;color:#fff;margin-bottom:18px}.hero .tr{font-size:56px;line-height:1}
.hero h1{margin:6px 0 2px;font-size:26px}.hero p{margin:0;opacity:.85}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:16px}
input:focus{outline:none;border-color:var(--p)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:active{background:var(--pd)}.btn.w{width:100%;margin-top:18px}.btn.ol{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}.btn.sm{padding:9px 12px;font-size:14px}.btn.vi{background:var(--vi)}
.er{color:var(--rd);font-size:13px;min-height:18px;margin:10px 0 0}
.hint{margin-top:14px;font-size:12.5px;color:var(--mu);text-align:center}
.ft{text-align:center;color:#fff;opacity:.8;font-size:12px;margin-top:18px}
/* app */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--c);border-bottom:1px solid var(--bd)}
.av{width:38px;height:38px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
.top .sp{flex:1}.top small{color:var(--mu)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.st{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.st b{display:block;font-size:22px}.st small{color:var(--mu)}
.tabs{display:flex;gap:6px;background:var(--c);padding:4px;border-radius:12px;border:1px solid var(--bd);margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:0;background:none;border-radius:9px;color:var(--mu);font-weight:600;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff}
.oc{background:var(--c);border:1px solid var(--bd);box-shadow:0 2px 8px #0000000d;border-radius:16px;padding:14px;margin-bottom:12px}
.oh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.oh b{font-size:16px}.oh .sp{flex:1}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.row{color:var(--mu);font-size:14px;margin:3px 0}.row b{color:var(--tx)}
.its{margin:8px 0;padding:8px 10px;background:var(--pl);border-radius:10px;font-size:14px}
.cod{display:inline-block;margin-top:4px;padding:4px 10px;border-radius:8px;background:#fff3d6;color:#8a5a00;font-weight:700;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.acts .btn{flex:1;min-width:110px}
.em{text-align:center;color:var(--mu);padding:36px 10px}
.ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#14291f;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.ts.on{opacity:1;transform:translate(-50%,0)}

/* login meniru login pelanggan */
.uauth{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;background:radial-gradient(700px 500px at 14% 18%,rgba(63,163,95,.6),transparent 62%),radial-gradient(640px 480px at 88% 84%,rgba(245,124,27,.38),transparent 62%),radial-gradient(500px 380px at 82% 12%,rgba(255,208,138,.22),transparent 62%),linear-gradient(135deg,#0d4a25,#126030 45%,#1B8A45)}
.ucard{background:#fff;color:#1f3a2b;border:1px solid #e4eadf;border-radius:16px;padding:22px 20px;width:min(400px,100%);position:relative;z-index:2;box-shadow:0 24px 60px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.12)}
.ucard h2{margin:4px 0;text-align:center;font-size:22px}.usub{color:#6b7c72;font-size:13px;text-align:center;margin:0 0 12px}
.ucard label{color:#1f3a2b}.ucard input{background:#fff;color:#1f3a2b;border:1px solid #e4eadf;border-radius:9px;padding:11px 12px}.ucard input:focus{border-color:#1B8A45}
.ucard .btn{background:#1B8A45;border-radius:9px;color:#fff}.ucard .btn.ol{background:#fff;color:#1f3a2b;border:1px solid #e4eadf}
.ucard .btn.w{margin-top:14px}.ucard .btn.w+.btn.w{margin-top:8px}
.ud{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ud i{position:absolute;left:var(--x);top:var(--y);width:var(--s,clamp(48px,7vw,88px));height:var(--s,clamp(48px,7vw,88px));display:grid;place-items:center;border-radius:50%;font-style:normal;font-size:calc(var(--s,clamp(48px,7vw,88px))*.5);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.42),rgba(255,255,255,.1) 62%);border:2px solid rgba(255,255,255,.32);box-shadow:0 14px 28px rgba(0,0,0,.22),inset 0 -6px 14px rgba(255,255,255,.12);animation:flt 5.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.ud b{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;border:2px solid rgba(255,255,255,.13);transform:translate(-50%,-50%);animation:drift 16s ease-in-out infinite}
.ud b:after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px dashed rgba(255,255,255,.12)}
.ud em{position:absolute;left:var(--x);top:var(--y);width:var(--z,8px);height:var(--z,8px);border-radius:50%;background:rgba(255,208,138,.7);box-shadow:0 0 12px rgba(255,208,138,.8);animation:tw 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(6deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-20px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@media(max-width:600px){.ud i:nth-of-type(n+5){display:none}.ud i{--s:46px}}
@media(prefers-reduced-motion:reduce){.ud *{animation:none!important}}

/* sidebar & layout dashboard */
.uside{position:fixed;inset:0 auto 0 0;width:260px;background:linear-gradient(180deg,#0f5a33,#1B8A55);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px;overflow:auto;z-index:20;transition:transform .2s}
.ulogo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.15)}
.ulogo b{font-size:20px;display:block}.ulogo small{opacity:.8;font-size:11px}
.ulogo img{width:58px;height:58px;border-radius:14px;background:#fff;object-fit:contain;flex:none}
.ugrp{font-size:11px;letter-spacing:1px;font-weight:700;opacity:.65;margin:18px 10px 6px}
.unav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#fff;padding:11px 12px;border-radius:10px;text-align:left;opacity:.9;cursor:pointer}
.unav:hover{background:rgba(255,255,255,.08)}.unav.on{background:rgba(255,255,255,.15);opacity:1;font-weight:600}
.unav em{margin-left:auto;font-style:normal;background:#f59e0b;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.uscrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}.uscrim.open{display:block}
.umain{margin-left:260px}
.utop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 24px}
.utop h2{margin:0;font-size:17px}.utop small{color:var(--mu)}.usp{flex:1}
.uchip{display:flex;align-items:center;gap:10px}
.uav{width:38px;height:38px;border-radius:50%;background:var(--pl);color:#1B8A55;display:grid;place-items:center;font-weight:700}
.uburg{display:none;background:none;border:0;padding:6px;color:var(--tx);cursor:pointer}
.uwrap{padding:24px;max-width:900px}
@media(max-width:900px){.uside{transform:translateX(-100%)}.uside.open{transform:none}.umain{margin-left:0}.uburg{display:block}.uwrap{padding:14px}.utop{padding-left:14px;padding-right:14px}.uname{display:none}}
h3.sh{margin:18px 0 10px;font-size:15px}
.tl{display:flex;margin:12px 0 4px}.tl div{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}
.tl div i{display:block;width:14px;height:14px;border-radius:50%;background:var(--bd);margin:0 auto 6px;position:relative;z-index:1}
.tl div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--bd)}.tl div:first-child:before{display:none}
.tl div.on{color:var(--tx);font-weight:600}.tl div.on i,.tl div.on:before{background:#1B8A55}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td{padding:7px 0;border-bottom:1px solid var(--bd)}.tb td:last-child{text-align:right;white-space:nowrap}.tb tr.t td{font-weight:700;border-bottom:0;font-size:15px}
.kv{display:flex;gap:10px;margin:5px 0;font-size:14px}.kv span{color:var(--mu);min-width:110px}.kv b{font-weight:600}

#app .btn{padding:6px 9px;font-size:12.5px;border-radius:8px;gap:6px;font-weight:600}
#app .acts{gap:5px}#app .acts .btn{flex:none;min-width:0}
#app .btn svg{flex:none}
</style>
</head>

// Akun driver: foli_drivers {wa:{nama,pin}}; pesanan dibagi dengan admin lewat foli2_o
let drivers=lj("foli_drivers",null);
if(!drivers){drivers={"081200000001":{nama:"Budi Driver",pin:"123456"}};sj("foli_drivers",drivers)}
const demo=()=>[["FL1050","Ibu Sari","081230000001","Kel. Ternate Tengah, dekat pasar",1,"COD",[["Bayam",2,4000],["Wortel",1,9000]],"Hari ini, 10.00–12.00"],
 ["FL1051","Pak Hasan","081230000002","Kel. Kota Baru, Jl. Pelabuhan 12",1,"Transfer bank",[["Tomat",2,8000],["Kentang",1,10000]],"Hari ini, 15.00–17.00"],
 ["FL1052","Warung Mama Ela","081230000003","Kel. Gambesi, depan masjid",2,"COD",[["Cabai Merah",2,18000],["Bawang Merah",2,12000]],"Hari ini, 10.00–12.00"]]
 .map((a,i)=>{const items=a[6].map(x=>({n:x[0],q:x[1],t:x[1]*x[2]})),sub=items.reduce((s,x)=>s+x.t,0),ongkir=sub>=50000?0:5000;
  return{id:a[0],d:Date.now()-i*36e5,nama:a[1],wa:a[2],alamat:a[3],st:a[4],bayar:a[5],items,sub,ongkir,total:sub+ongkir,slot:a[7]}});
let O=lj("foli2_o",null)||demo(),D=null,pg="ring",prev="tugas",did=null,pend=null;
const saveO=()=>sj("foli2_o",O);

function login(){
  const w=nwa($("#w").value),p=$("#pin").value.trim(),d=drivers[w];
  if(!w||!p){$("#er").textContent="Isi nomor WhatsApp dan PIN.";return}
  if(!d||d.pin!==p){$("#er").textContent="Nomor atau PIN salah.";return}
  D={wa:w,nama:d.nama};sj("foli_sess_drv",w);dlog("Login driver");$("#er").textContent="";$("#pin").value="";pg="ring";show()
}
function logout(){dlog("Logout driver");D=null;try{localStorage.removeItem("foli_sess_drv")}catch(e){}closeSb();show()}
function show(){
  $("#lg").classList.toggle("hide",!!D);$("#app").classList.toggle("hide",!D);
  if(D){$("#av").textContent=D.nama[0].toUpperCase();$("#nm").textContent=D.nama;$("#uburg").innerHTML=ic("menu",26);render()}
}

// Alur: Diproses -> (ambil) Diantar -> (selesai) Selesai
const mine=o=>o.drv===D.wa;
const todo=()=>O.filter(o=>o.st===1||(o.st===2&&mine(o)));
const done=()=>O.filter(o=>o.st===3&&mine(o));
const T={ring:"Ringkasan",tugas:"Pesanan Antar",riwayat:"Riwayat",profil:"Profil Saya",detail:"Perincian Pesanan"};
function side(){
  const N=[["ring","home"],["tugas","list"],["riwayat","clock"],["profil","user"]],n=todo().length,act=pg==="detail"?prev:pg;
  $("#uside").innerHTML=`<div class="ulogo"><img src="${LOGO}" alt="Dibo Dibo"><div><b>Dibo Dibo</b><small>Portal Driver</small></div></div><div class="ugrp">MENU</div>
  ${N.map(x=>`<button class="unav ${act===x[0]?"on":""}" data-p="${x[0]}">${ic(x[1],18)}<span>${T[x[0]]}</span>${x[0]==="tugas"&&n?`<em>${n}</em>`:""}</button>`).join("")}
  <div class="ugrp">LAINNYA</div><button class="unav" data-out>${ic("out",18)}<span>Keluar</span></button>`;
}
function render(){side();$("#ttl").textContent=T[pg];
  const v={ring:vRing,tugas:()=>vList(todo(),"🎉 Belum ada pesanan untuk diantar."),riwayat:()=>vList(done(),"Belum ada pengantaran selesai."),profil:vProfil,detail:vDetail}[pg]();
  $("#view").innerHTML=v;window.scrollTo(0,0)}
function vRing(){const t=todo(),dn=done(),cod=dn.filter(o=>o.bayar==="COD").reduce((s,o)=>s+o.total,0);
  return `<div class="stats"><div class="st"><b>${t.filter(o=>o.st===1).length}</b><small>Siap diambil</small></div><div class="st"><b>${t.filter(o=>o.st===2).length}</b><small>Sedang diantar</small></div><div class="st"><b>${dn.length}</b><small>Selesai</small></div></div>
  <div class="oc"><div class="kv"><span>Tunai terkumpul</span><b>${rp(cod)}</b></div><div class="kv"><span>Driver</span><b>${esc(D.nama)}</b></div></div>
  <h3 class="sh">Pesanan berikutnya</h3>${t.length?t.slice(0,3).map(card).join(""):'<div class="em">🎉 Belum ada pesanan untuk diantar.</div>'}`}
function vList(L,em){return L.length?L.map(card).join(""):`<div class="em">${em}</div>`}
function acts(o){return o.st===1?`<button class="btn" data-a="take" data-i="${esc(o.id)}">${ic("take",14)} Ambil</button>`:o.st===2?`<button class="btn" data-a="done" data-i="${esc(o.id)}">${ic("done",14)} Selesai</button>`:""}
function links(o){const q=encodeURIComponent(o.alamat+", Ternate"),map=o.lat?`https://www.google.com/maps?q=${o.lat},${o.lng}`:`https://www.google.com/maps/search/?api=1&query=${q}`,w="62"+nwa(o.wa).slice(1);
  return `<a class="btn ol" target="_blank" rel="noopener" href="${map}">${ic("geo",14)} Peta</a><a class="btn ol" target="_blank" rel="noopener" href="https://wa.me/${w}">${ic("wa",14)} WA</a>`}
function card(o){
  return `<div class="oc"><div class="oh"><b>${esc(o.id)}</b><span class="pill" style="background:${SC[o.st]}">${ST[o.st]}</span><span class="sp"></span><b>${rp(o.total)}</b></div>
  <div class="row"><b>${esc(o.nama)}</b> · ${esc(o.alamat)}</div><div class="row">🕒 ${esc(o.slot||"-")}</div>
  <div class="its">${o.items.map(i=>esc(i.n)+" ×"+i.q).join(", ")}</div>
  ${o.bayar==="COD"&&o.st<3?`<span class="cod">Tagih tunai ${rp(o.total)}</span>`:`<span class="row">Pembayaran: ${esc(o.bayar)}</span>`}
  <div class="acts"><button class="btn ol" data-d="${esc(o.id)}">${ic("eye",14)} Perincian</button>${acts(o)}${links(o)}</div></div>`;
}
function vDetail(){const o=O.find(x=>x.id===did);if(!o)return '<div class="em">Pesanan tidak ditemukan.</div>';
  const S=["Diterima","Disiapkan","Diantar","Selesai"];
  return `<button class="btn ol sm" data-back style="margin-bottom:12px">${ic("back",14)} Kembali</button>
  <div class="oc"><div class="oh"><b>${esc(o.id)}</b><span class="pill" style="background:${SC[o.st]}">${ST[o.st]}</span><span class="sp"></span><small style="color:var(--mu)">${new Date(o.d).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div>
  <div class="tl">${S.map((s,i)=>`<div class="${i<=o.st?"on":""}"><i></i>${s}</div>`).join("")}</div></div>
  <div class="oc"><h3 class="sh" style="margin-top:0">Pelanggan &amp; pengiriman</h3><div class="kv"><span>Nama</span><b>${esc(o.nama)}</b></div><div class="kv"><span>No. WhatsApp</span><b>${esc(nwa(o.wa))}</b></div><div class="kv"><span>Alamat</span><b>${esc(o.alamat)}</b></div><div class="kv"><span>Jam antar</span><b>${esc(o.slot||"-")}</b></div><div class="kv"><span>Pembayaran</span><b>${esc(o.bayar)}</b></div>${o.drvNama?`<div class="kv"><span>Driver</span><b>${esc(o.drvNama)}</b></div>`:""}${o.bayar==="COD"&&o.st<3?`<span class="cod">Tagih tunai ${rp(o.total)}</span>`:""}</div>
  <div class="oc"><h3 class="sh" style="margin-top:0">Rincian barang</h3><table class="tb">${o.items.map(i=>`<tr><td>${esc(i.n)} ×${i.q}</td><td>${i.t!=null?rp(i.t):""}</td></tr>`).join("")}
  ${o.sub!=null?`<tr><td>Subtotal</td><td>${rp(o.sub)}</td></tr><tr><td>Ongkir</td><td>${o.ongkir?rp(o.ongkir):"Gratis"}</td></tr>`:""}<tr class="t"><td>Total</td><td>${rp(o.total)}</td></tr></table>
  <div class="acts">${acts(o)}${links(o)}</div></div>`}
function vProfil(){const dn=done(),cod=dn.filter(o=>o.bayar==="COD").reduce((s,o)=>s+o.total,0);
  return `<div class="oc"><div class="oh"><div class="uav" style="width:54px;height:54px;font-size:22px">${esc(D.nama[0].toUpperCase())}</div><div><b>${esc(D.nama)}</b><br><small style="color:var(--mu)">Driver Dibo Dibo</small></div></div>
  <div class="kv"><span>No. WhatsApp</span><b>${esc(D.wa)}</b></div><div class="kv"><span>Total antar</span><b>${dn.length} pesanan</b></div><div class="kv"><span>Tunai terkumpul</span><b>${rp(cod)}</b></div>
  <div class="acts"><button class="btn ol" data-out>${ic("out",14)} Keluar</button></div></div>`}

const closeSb=()=>{$("#uside").classList.remove("open");$("#uscrim").classList.remove("open")};
const ask1=async(t,x,b,d)=>{if(!window.Swal)return true;const r=await Swal.fire({title:t,text:x,icon:d?"warning":"question",showCancelButton:true,confirmButtonText:b,cancelButtonText:"Batal",confirmButtonColor:d?"#ef4444":"#1B8A55",reverseButtons:true,focusCancel:!!d});return r.isConfirmed};
const ask=async(t,x,b,d)=>{if(!await ask1(t,x,b,d))return false;if(!window.Swal)return true;const r=await Swal.fire({title:"Yakin?",text:t,icon:"warning",showCancelButton:true,confirmButtonText:b,cancelButtonText:"Batal",confirmButtonColor:d?"#ef4444":"#1B8A55",reverseButtons:true,focusCancel:true});return r.isConfirmed};
document.addEventListener("click",async e=>{
  const c=s=>e.target.closest(s);let b;
  if(b=c("[data-p]")){pg=b.dataset.p;pend=null;closeSb();return render()}
  if(b=c("[data-d]")){prev=pg==="detail"?prev:pg;did=b.dataset.d;pg="detail";return render()}
  if(c("[data-back]")){pg=prev;return render()}
  if(c("[data-out]")){if(!await ask("Keluar dari akun?","Kamu perlu masuk lagi untuk mengambil pesanan.","Ya, keluar",true))return;return logout()}
  if(c("#uburg")){$("#uside").classList.add("open");$("#uscrim").classList.add("open");return}
  if(c("#uscrim"))return closeSb();
  if(b=c("[data-a]")){
    const o=O.find(x=>x.id===b.dataset.i);if(!o)return;
    if(b.dataset.a==="take"){if(o.st!==1){toast("Pesanan sudah diambil driver lain");O=lj("foli2_o",O);return render()}
      if(!await ask("Ambil pesanan "+o.id+"?","Pesanan ini akan menjadi tanggung jawabmu untuk diantar.","Ya, ambil"))return;
      o.st=2;o.drv=D.wa;o.drvNama=D.nama;dlog("Ambil pesanan",o.id);toast("Pesanan diambil, selamat mengantar!")}
    else{if(!await ask("Selesaikan pesanan "+o.id+"?","Pastikan pesanan sudah diterima pelanggan"+(o.bayar==="COD"?" dan tunai "+rp(o.total)+" sudah dibayar.":"."),"Ya, selesai"))return;
      o.st=3;o.doneAt=Date.now();dlog("Pesanan selesai",o.id);toast("Pesanan selesai ✓")}
    saveO();render()}
});
$("#go").onclick=login;
["w","pin"].forEach(i=>$("#"+i).addEventListener("keydown",e=>{if(e.key==="Enter")login()}));
const sw=lj("foli_sess_drv",null);if(sw&&drivers[sw])D={wa:sw,nama:drivers[sw].nama};
show();
</script>
</body>
</html>
